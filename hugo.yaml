      - "DevOps"
      - "Site Reliability Engineering"
      - "Kubernetes"
      - "Infrastructure as Code"
      - "Terraform"
      - "Ansible"
      - "GitOps"
      - "CI/CD"
      - "Observability"
      - "Data Platform"
      - "Apache Kafka"
      - "Apache Airflow"
      - "Apache Spark"
      - "Trino"
      - "Linux"
